<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6" />

  <!-- Central Balance / Scale & Percentage Graphic -->
  <g transform="translate(0, 10)">
    <!-- Scale Base & Pillar -->
    <rect x="246" y="160" width="20" height="190" rx="10" fill="#64748b" />
    <path d="M200 370 L312 370 C317 370 322 375 320 380 L310 400 C308 404 304 406 300 406 L212 406 C208 406 204 404 202 400 L192 380 C190 375 195 370 200 370 Z" fill="#475569" />
    
    <!-- Balance Beam tilted favoring smart savings -->
    <g transform="rotate(-9, 256, 170)">
      <rect x="100" y="163" width="312" height="14" rx="7" fill="#94a3b8" />
      <circle cx="256" cy="170" r="16" fill="#f8fafc" />
      <circle cx="256" cy="170" r="8" fill="#0f172a" />

      <!-- Left Pan (Lighter/Higher = Smarter unit price) -->
      <line x1="120" y1="170" x2="90" y2="240" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
      <line x1="120" y1="170" x2="150" y2="240" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
      <path d="M70 240 C70 265 170 265 170 240 Z" fill="url(#accentGrad)" filter="url(#glow)" />
      
      <!-- Right Pan (Heavier/Lower = Expensive/Reduflation) -->
      <line x1="392" y1="170" x2="362" y2="280" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
      <line x1="392" y1="170" x2="422" y2="280" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
      <path d="M342 280 C342 305 442 305 442 280 Z" fill="#ef4444" opacity="0.85" />
    </g>

    <!-- Percentage Shield / Savings Badge at the top -->
    <g transform="translate(256, 100)" filter="url(#glow)">
      <circle cx="0" cy="0" r="44" fill="#10b981" />
      <text x="0" y="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">%</text>
    </g>
  </g>
</svg>
